<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#27272f" />
    <title>dingoConfig</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #27272f;
            color: #e6e6ea;
            font: 16px/1.5 Roboto, system-ui, sans-serif;
        }
        main { max-width: 340px; padding: 24px; text-align: center; }
        img { width: 72px; height: 72px; margin-bottom: 12px; }
        h1 { margin: 0 0 8px; font-size: 1.3rem; font-weight: 500; }
        p { margin: 0 0 12px; color: #a8a8b3; }
        button {
            margin-top: 8px;
            padding: 10px 28px;
            border: 1px solid #7fff00;
            border-radius: 6px;
            background: none;
            color: #7fff00;
            font: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <img src="pwa/app-192.png" alt="" />
    <h1>dingoConfig is not reachable</h1>
    <p>Join the same network as the dash: its own WiFi <b>YY3588</b>, or the hotspot or WiFi it is on.</p>
    <p>If dingoConfig runs on this computer, start it first.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
